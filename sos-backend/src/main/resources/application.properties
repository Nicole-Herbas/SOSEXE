spring.application.name=sos-backend

# Importar configuración local opcional si existe en classpath (ignorada por Git)
spring.config.import=optional:classpath:application-local.properties

# Conexión a Base de Datos (variables de entorno o application-local.properties)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Docker Compose integrado deshabilitado
spring.docker.compose.enabled=false

server.port=8080

# Seguridad JWT
jwt.secret=${JWT_SECRET:sos-exe-dev-secret-key-2026-fallback-super-seguro-ucb-min-256bits}
jwt.access-expiration-ms=900000
refresh-token.expiration-ms=604800000

# API de Noticias externas (newsdata.io) — plan gratuito: 200 req/dia
newsdata.apikey=${NEWSDATA_API_KEY:pub_6a44f54be1f3468c8b0d48f2f4cc2c94}


# Subida de documentos (SOS-41): 4 archivos de hasta 10 MB cada uno
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=45MB

# Carpeta donde se guardan los documentos subidos (ignorada por Git)
app.uploads.dir=${UPLOADS_DIR:uploads}