<div class="login-container">
  <div class="info-panel">
    <div class="logo">{{ strings.logoTag }}</div>
    <h1>{{ strings.panelTitulo }}</h1>
    <p>{{ strings.panelDescripcion }}</p>
  </div>

  <div class="form-panel">
    <h2>{{ strings.tituloPagina }}</h2>
    <p>{{ strings.subtitulo }}</p>

    <div class="error-banner" *ngIf="errorMessage">
      <span>⚠️ {{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="login-email">{{ strings.labelEmail }}</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          [placeholder]="strings.placeholderEmail">
        <small class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          {{ strings.errorEmail }}
        </small>
      </div>

      <div class="form-group">
        <label for="login-password">{{ strings.labelPassword }}</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          [placeholder]="strings.placeholderPassword">
        <small class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          {{ strings.errorPassword }}
        </small>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ strings.botonSubmit }}</span>
        <span *ngIf="isLoading">{{ strings.botonCargando }}</span>
      </button>
    </form>

    <div class="links">
      <a routerLink="/registro">{{ strings.linkRegistro }}</a>
      <a routerLink="/">{{ strings.linkCancelar }}</a>
    </div>
  </div>
</div>
