<section class="admin" aria-labelledby="admin-titulo">
  <header class="admin-encabezado">
    <h1 id="admin-titulo">{{ 'alertas.admin' | translate }}</h1>
    <div class="admin-acciones">
      <a class="accion accion-primaria" routerLink="/admin/alertas/crear">
        <span aria-hidden="true">＋</span>{{ 'alertas.encabezado' | translate }}
      </a>
      <a class="accion accion-secundaria" routerLink="/admin/alertas">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" />
        </svg>
        {{ 'alertas.revisarEncabezado' | translate }}
      </a>
    </div>
  </header>
  <div class="admin-contenido">
    <app-revisar-puntos />
    <section class="admin-centros" aria-labelledby="admin-centros-titulo">
      <h2 id="admin-centros-titulo">{{ 'adminCentros.titulo' | translate }}</h2>
      <p>{{ 'adminCentros.descripcion' | translate }}</p>
      <app-lista-centros variante="admin" />
    </section>
  </div>
</section>
