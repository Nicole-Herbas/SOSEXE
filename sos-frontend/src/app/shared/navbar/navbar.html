<nav class="navbar">

  <div class="navbar-brand">

    <div class="navbar-icon">
      {{ textos.iconoMarca }}
    </div>

    <div class="navbar-titles">

      <span class="navbar-logo">
        {{ textos.marca }}
      </span>

      <span class="navbar-tagline">
        {{ textos.lema }}
      </span>

    </div>

  </div>


  <button
    class="navbar-toggle"
    (click)="menuAbierto = !menuAbierto"
  >
    {{ textos.iconoMenu }}
  </button>


  <ul
    class="navbar-links"
    [class.abierto]="menuAbierto"
  >

    <li>
      <a routerLink="/inicio" routerLinkActive="active">
        {{ textos.enlaces.inicio }}
      </a>
    </li>

    <li>
      <a routerLink="/mapa" routerLinkActive="active">
        {{ textos.enlaces.mapa }}
      </a>
    </li>

    <li>
      <a routerLink="/donar" routerLinkActive="active">
        {{ textos.enlaces.donar }}
      </a>
    </li>

    <li>
      <a routerLink="/voluntariado" routerLinkActive="active">
        {{ textos.enlaces.voluntariados }}
      </a>
    </li>

    <li>
      <a routerLink="/noticias" routerLinkActive="active">
        {{ textos.enlaces.noticias }}
      </a>
    </li>

    <li>
      <a routerLink="/acerca-de" routerLinkActive="active">
        {{ textos.enlaces.acercaDe }}
      </a>
    </li>

  </ul>


  <div class="navbar-actions">

    <button
      class="navbar-bell"
      [attr.aria-label]="textos.notificacionesAria"
    >
      {{ textos.iconoNotificacion }}

      <span class="navbar-badge">
        {{ textos.cantidadNotificaciones }}
      </span>
    </button>


    <a
      class="navbar-login"
      routerLink="/login"
      routerLinkActive="active"
    >
      {{ textos.iniciarSesion }}
    </a>


    <button class="navbar-cta">
      {{ textos.quieroAyudar }}
    </button>

  </div>

</nav>
