<nav class="navbar">
  <div class="navbar-brand">
    <div class="navbar-icon">✛</div>
    <div class="navbar-titles">
      <span class="navbar-logo">SOS.exe</span>
      <span class="navbar-tagline">Juntos ante desastres naturales</span>
    </div>
  </div>

  <button class="navbar-toggle" (click)="menuAbierto = !menuAbierto">
    ☰
  </button>

  <ul class="navbar-links" [class.abierto]="menuAbierto">
    <li><a routerLink="/inicio" routerLinkActive="active">Inicio</a></li>
    <li><a routerLink="/mapa" routerLinkActive="active">Mapa</a></li>
    <li><a routerLink="/donar" routerLinkActive="active">Donar</a></li>
    <li><a routerLink="/voluntariado" routerLinkActive="active">Voluntariados</a></li>
    <li><a routerLink="/noticias" routerLinkActive="active">Noticias</a></li>
    <li><a routerLink="/acerca-de" routerLinkActive="active">Acerca de</a></li>
  </ul>

  <div class="navbar-actions">
    <button class="navbar-bell" aria-label="Notificaciones">
      🔔
      <span class="navbar-badge">1</span>
    </button>

    <!-- Si NO está logueado: mostrar botón de iniciar sesión -->
    <a *ngIf="!isLoggedIn" class="navbar-login" routerLink="/login">Iniciar sesión</a>

    <!-- Si está logueado: mostrar nombre + botón salir -->
    <div *ngIf="isLoggedIn" class="navbar-user">
      <span class="navbar-user-name">👤 {{ nombreUsuario }}</span>
      <button class="navbar-logout-btn" (click)="logout()">Salir</button>
    </div>

    <button class="navbar-cta">♥ Quiero ayudar</button>
  </div>
</nav>
